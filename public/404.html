<\!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found | FINRA Exam Practice</title>
  <script>
    // GitHub Pages 404 redirect: preserve path and redirect to index with hash
    const base = '/finra-sie-exam';
    const path = window.location.pathname.replace(base, '') || '/';
    window.location.replace(base + '/?redirect=' + encodeURIComponent(path));
  </script>
  <style>
    body { font-family: system-ui, sans-serif; background: #F4EFE7; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { background: #fff; border: 1px solid #E5E0D8; padding: 2.5rem; max-width: 380px; text-align: center; }
    h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
    p  { color: #6b6560; font-size: 0.875rem; margin: 0 0 1.5rem; }
    a  { display: inline-block; background: #8F5A39; color: #fff; padding: 0.75rem 1.5rem; text-decoration: none; font-size: 0.875rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Page not found</h1>
    <p>Redirecting you back to the home page…</p>
    <a href="/finra-sie-exam/">Go home →</a>
  </div>
</body>
</html>
